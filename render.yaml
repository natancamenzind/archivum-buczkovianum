services:
  - type: web
    name: archivum-test
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./deploy/Dockerfile
    autoDeployTrigger: commit
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py createsuperuser --noinput
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archivum-test-db-v2
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: archivum-test
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Sentry projects studio-ape/buczkovianum-backend and studio-ape/buczkovianum-frontend.
      # A DSN is not a secret: the frontend one ships in the bundle.
      - key: SENTRY_DSN
        value: https://2a4323ac5ca75db4a48d80fde3f5ccd3@o367010.ingest.us.sentry.io/4512394954801153
      - key: SENTRY_ENVIRONMENT
        value: test
      - key: VITE_SENTRY_DSN
        value: https://699a3b0ff651f8f916b7f77c4dacb3be@o367010.ingest.us.sentry.io/4512394954932224
      - key: VITE_SENTRY_ENVIRONMENT
        value: test
      - key: SEARCH_TS_CONFIG
        value: simple
      - key: ROBOTS_NOINDEX
        value: "true"
      - key: AWS_S3_REGION_NAME
        value: eu-north-1
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: archivum-test-db-v2
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    databaseName: archivum
    user: archivum
    ipAllowList: []
