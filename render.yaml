services:
  - type: web
    name: archivum-test
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./deploy/Dockerfile
    autoDeployTrigger: commit
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py createsuperuser --noinput
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archivum-test-db-v2
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: archivum-test
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEARCH_TS_CONFIG
        value: simple
      - key: ROBOTS_NOINDEX
        value: "true"
      - key: AWS_S3_REGION_NAME
        value: eu-north-1
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: archivum-test-db-v2
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    databaseName: archivum
    user: archivum
    ipAllowList: []
