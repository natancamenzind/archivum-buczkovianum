services:
  - type: web
    name: archivum-test
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./deploy/Dockerfile
    autoDeployTrigger: commit
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py createsuperuser --noinput
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archivum-test-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: archivum-test
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEARCH_TS_CONFIG
        value: simple
      - key: ROBOTS_NOINDEX
        value: "true"
      - key: AWS_S3_REGION_NAME
        value: eu-north-1
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: cron
    name: archivum-test-backup
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 3 * * *"
    dockerfilePath: ./deploy/backup.Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archivum-test-db
          property: connectionString
      - key: AWS_DEFAULT_REGION
        value: eu-north-1
      - key: BACKUP_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: archivum-test
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: archivum-test
          type: web
          envVarKey: AWS_SECRET_ACCESS_KEY

databases:
  - name: archivum-test-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: archivum
    user: archivum
    ipAllowList: []
