name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-not-secret
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/buczkovianum

jobs:
  # Decides which side's checks run. A job skipped by its `if` counts as passed
  # for required status checks. Gate on `!= 'false'` so the checks still run if
  # this job fails and leaves its outputs empty.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - Makefile
              - .github/workflows/ci.yml
              - backend/**
              - pyproject.toml
              - uv.lock
              - .python-version
            frontend:
              - Makefile
              - .github/workflows/ci.yml
              - frontend/**
              - design/tokens/**

  # Job names are referenced by the branch protection rule on main. Renaming one
  # requires updating the required status checks.
  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint-backend

  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make typecheck-backend

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    services:
      # Architecture §1 targets PostgreSQL 19; tests never run on SQLite.
      # Switch to postgres:19 once the final release is published.
      postgres:
        image: postgres:19rc1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buczkovianum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test-backend

  # Frontend: one job per make target, reported as separate checks "frontend (lint)",
  # "frontend (typecheck)", "frontend (test)" and "frontend (build)". A human adds them to the
  # required status checks on main (docs/plan.md, D8).
  # The gate is on the steps, not the job: a matrix job skipped by its `if` reports one
  # unexpanded "frontend" check, so the required checks above would never arrive.
  frontend:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, typecheck, test, build]
    env:
      RUN: ${{ needs.changes.outputs.frontend != 'false' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v4
      - if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: env.RUN == 'true'
        run: npm ci --prefix frontend
      - if: env.RUN == 'true'
        run: make ${{ matrix.target }}-frontend

  # Fails if the committed frontend/src/api/ is stale. A serializer or view change on the backend
  # can stale it, and so can an openapi-typescript update on the frontend, so either side runs it.
  # spectacular builds the schema without a database: DATABASE_URL is set but never connected to.
  api-client:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.backend != 'false'
      || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix frontend
      - run: make check-api-client
