openapi: 3.0.3
info:
  title: Archivum Buczkovianum API
  version: 1.0.0
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      description: |-
        The About page (US-RA-13): introduction, project text and the team by group.

        Empty groups are left out (R-02), so the page renders every group it gets.
      tags:
      - about
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPage'
          description: ''
  /api/works/:
    get:
      operationId: works_list
      description: 'The works list (US-RA-18): every published work as a card, by
        first edition.'
      tags:
      - works
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkCard'
          description: ''
components:
  schemas:
    AboutPage:
      type: object
      description: 'US-RA-13. `intro` and `project` are rich text: HTML, sanitized
        when an editor saves it.'
      properties:
        intro:
          type: string
          description: HTML.
        project:
          type: string
          description: HTML.
        team:
          type: array
          items:
            $ref: '#/components/schemas/TeamGroup'
          description: Groups that have members, in the order of TeamMember.Group.
      required:
      - intro
      - project
      - team
    GroupEnum:
      enum:
      - leadership
      - team
      - site
      type: string
      description: |-
        * `leadership` - Project leadership
        * `team` - Team members
        * `site` - Website development
    TeamGroup:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/GroupEnum'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
      required:
      - group
      - members
    TeamMember:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
      required:
      - bio
      - name
      - role
    WorkCard:
      type: object
      description: |-
        The work card (US-RA-01 AC3), from a queryset with `with_year()` and
        `with_fragment_count()`.
      properties:
        slug:
          type: string
          readOnly: true
          description: Part of the page address.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        genre:
          type: string
          readOnly: true
          description: E.g. powieść.
        year:
          type: integer
          readOnly: true
          nullable: true
          description: The year of the first edition; null without editions.
        cover_image:
          type: string
          readOnly: true
          description: Empty when the work has no cover.
        cover_image_alt:
          type: string
          readOnly: true
        fragment_count:
          type: integer
          readOnly: true
          description: Visible fragments of the main typescript (D19); 0 without one.
      required:
      - cover_image
      - cover_image_alt
      - fragment_count
      - genre
      - slug
      - title
      - year
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
