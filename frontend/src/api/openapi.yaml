openapi: 3.0.3
info:
  title: Archivum Buczkovianum API
  version: 1.0.0
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      description: |-
        The About page (US-RA-13): introduction, project text and the team by group.

        Empty groups are left out (R-02), so the page renders every group it gets.
      tags:
      - about
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPage'
          description: ''
  /api/documents/{id}/:
    get:
      operationId: documents_retrieve
      description: |-
        The text of a published item for the reader (R-11), with its fragments and their
        published tags. The text of a draft, or of no item, is not found (R-06).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/editor/fragments/:
    get:
      operationId: editor_fragments_list
      tags:
      - editor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditorFragment'
          description: ''
    post:
      operationId: editor_fragments_create
      tags:
      - editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorFragment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditorFragment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditorFragment'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorFragment'
          description: ''
  /api/editor/fragments/{id}/:
    patch:
      operationId: editor_fragments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditorFragment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditorFragment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditorFragment'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorFragment'
          description: ''
    delete:
      operationId: editor_fragments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - editor
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/home/:
    get:
      operationId: home_retrieve
      description: |-
        The home page (US-RA-01): introduction and portrait, the counts, the work cards and the
        tag cloud. The featured fragment (US-RA-02) is not here yet.
      tags:
      - home
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePage'
          description: ''
  /api/search/autocomplete/:
    get:
      operationId: search_autocomplete_list
      description: |-
        Suggestions under the search fields (US-RA-17): published works and tags whose title
        contains `q`. Empty for a blank `q`.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: What the reader has typed so far.
      tags:
      - search
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
          description: ''
  /api/tags/:
    get:
      operationId: tags_list
      description: |-
        The tags list (US-RA-20): published tags with at least one occurrence (D26), the most
        frequent first. The cloud and the alphabetical index both take this one list.
      tags:
      - tags
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagCount'
          description: ''
  /api/typescripts/:
    get:
      operationId: typescripts_list
      description: |-
        The typescripts list (US-RA-19): published typescripts grouped by their published work,
        works by first edition. A work without published typescripts has no group (R-02).
      tags:
      - typescripts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TypescriptGroup'
          description: ''
  /api/typescripts/{id}/:
    get:
      operationId: typescripts_retrieve
      description: |-
        The typescript page (US-RA-08). A draft typescript is not found (R-06); a draft work
        leaves out the work, its contextual materials and nothing else.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - typescripts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypescriptPage'
          description: ''
  /api/works/:
    get:
      operationId: works_list
      description: 'The works list (US-RA-18): every published work as a card, by
        first edition.'
      tags:
      - works
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkCard'
          description: ''
components:
  schemas:
    AboutPage:
      type: object
      description: 'US-RA-13. `intro` and `project` are rich text: HTML, sanitized
        when an editor saves it.'
      properties:
        intro:
          type: string
          description: HTML.
        project:
          type: string
          description: HTML.
        team:
          type: array
          items:
            $ref: '#/components/schemas/TeamGroup'
          description: Groups that have members, in the order of TeamMember.Group.
      required:
      - intro
      - project
      - team
    ContextualMaterials:
      type: object
      properties:
        texts:
          type: array
          items:
            $ref: '#/components/schemas/MaterialText'
          description: By title.
        visuals:
          type: array
          items:
            $ref: '#/components/schemas/VisualMaterial'
          description: By title.
      required:
      - texts
      - visuals
    Document:
      type: object
      description: The text of an item for the reader (R-11, architecture section
        4.4).
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        text:
          type: string
          readOnly: true
        page_offsets:
          type: array
          items:
            type: integer
            maximum: 2147483647
            minimum: 0
          readOnly: true
        scan:
          type: string
          readOnly: true
          description: PDF URL; empty for a plain text.
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentFragment'
          readOnly: true
          description: By position.
      required:
      - fragments
      - id
      - kind
      - page_offsets
      - scan
      - text
    DocumentFragment:
      type: object
      description: |-
        A fragment for the reader (R-11), from a queryset with `with_number()`.

        The context holds the fragments' `document` and the `institution` of its owner.
      properties:
        id:
          type: integer
          readOnly: true
        start:
          type: integer
          readOnly: true
        end:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
          description: 1-based, by position in the text.
        start_page:
          type: integer
          nullable: true
          readOnly: true
          description: 1-based scan page the fragment starts on; null for a plain
            text.
        location:
          type: string
          readOnly: true
          description: E.g. rozdział I.
        shelfmark:
          type: string
          readOnly: true
          description: E.g. "ML, sygn. 1618.0009"; may be empty.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagChip'
          readOnly: true
          description: Published tags, by name.
      required:
      - end
      - id
      - location
      - number
      - shelfmark
      - start
      - start_page
      - tags
    EditorFragment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        document:
          type: integer
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        quote:
          type: string
        tag_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EditorTag'
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
          description: The text changed. Check the fragment, then clear this box.
      required:
      - document
      - end
      - id
      - needs_review
      - quote
      - start
      - tag_ids
      - tags
    EditorTag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Name
      required:
      - id
      - title
    FragmentPreview:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FragmentRow'
          description: Featured first, then text order (R-09).
        total:
          type: integer
          description: The number of all the fragments.
      required:
      - items
      - total
    FragmentRow:
      type: object
      description: |-
        A row of "Fragmenty z maszynopisu" (US-RA-08 AC3), from a queryset with `with_number()`.

        The context's `institution` is the one of the fragments' document owner.
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
          description: 1-based, by position in the text.
        location:
          type: string
          readOnly: true
          description: E.g. rozdział I.
        shelfmark:
          type: string
          readOnly: true
          description: E.g. "ML, sygn. 1618.0009"; may be empty.
      required:
      - id
      - location
      - number
      - shelfmark
    GroupEnum:
      enum:
      - leadership
      - team
      - site
      type: string
      description: |-
        * `leadership` - Project leadership
        * `team` - Team members
        * `site` - Website development
    HomePage:
      type: object
      description: 'US-RA-01. `intro` is rich text: HTML, sanitized when an editor
        saves it.'
      properties:
        intro:
          type: string
          description: HTML.
        portrait:
          type: string
          readOnly: true
          description: Empty when there is no portrait.
        portrait_alt:
          type: string
        statistics:
          $ref: '#/components/schemas/HomeStatistics'
        works:
          type: array
          items:
            $ref: '#/components/schemas/WorkCard'
          description: By first edition.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagCount'
          description: 'The tag cloud: tags in use, the most frequent first.'
      required:
      - intro
      - portrait
      - portrait_alt
      - statistics
      - tags
      - works
    HomeStatistics:
      type: object
      properties:
        works:
          type: integer
          description: Published works.
        fragments:
          type: integer
          description: Visible fragments of every document.
        tags:
          type: integer
          description: Published tags.
      required:
      - fragments
      - tags
      - works
    KindEnum:
      enum:
      - ocr
      - plain
      type: string
      description: |-
        * `ocr` - Scan + OCR text
        * `plain` - Plain text
    MaterialText:
      type: object
      description: |-
        A row of "Teksty sekundarne" (R-08): a secondary text, or a contextual material that is
        not an image, which shows its title only (D5).
      properties:
        url:
          type: string
        author:
          type: string
          readOnly: true
        title:
          type: string
        publication:
          type: string
          readOnly: true
          description: Publisher, place, year, pages.
      required:
      - author
      - publication
      - title
      - url
    PatchedEditorFragment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        document:
          type: integer
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        quote:
          type: string
        tag_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EditorTag'
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
          description: The text changed. Check the fragment, then clear this box.
    Suggestion:
      type: object
      description: 'A suggestion under the search fields (US-RA-17): a work or a tag,
        and its page.'
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
      - title
      - type
      - url
    TagChip:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          description: Part of the page address.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
          title: Name
      required:
      - slug
      - title
    TagCount:
      type: object
      description: A tag with its occurrence count (US-RA-20), from a queryset with
        `with_occurrences()`.
      properties:
        slug:
          type: string
          readOnly: true
          description: Part of the page address.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
          title: Name
        occurrences:
          type: integer
          readOnly: true
      required:
      - occurrences
      - slug
      - title
    TeamGroup:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/GroupEnum'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
      required:
      - group
      - members
    TeamMember:
      type: object
      properties:
        name:
          type: string
          readOnly: true
          title: Full name
        role:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
          title: Short biography
      required:
      - bio
      - name
      - role
    TypeEnum:
      enum:
      - work
      - tag
      type: string
      description: |-
        * `work` - work
        * `tag` - tag
    TypescriptGroup:
      type: object
      description: A work's group on the typescripts list (US-RA-19 AC2), from a work
        with `with_year()`.
      properties:
        slug:
          type: string
        title:
          type: string
        genre:
          type: string
        year:
          type: integer
          nullable: true
          description: The year of the first edition; null without editions.
        typescripts:
          type: array
          items:
            $ref: '#/components/schemas/TypescriptRow'
          description: By shelfmark, as numbers.
      required:
      - genre
      - slug
      - title
      - typescripts
      - year
    TypescriptPage:
      type: object
      description: 'US-RA-08. `description` is rich text: HTML, sanitized when an
        editor saves it.'
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          description: HTML.
        shelfmark:
          type: string
          description: E.g. "ML, sygn. 1618"; may be empty.
        document:
          type: integer
          description: 'The text for the reader: /api/documents/<id>/.'
        page_count:
          type: integer
        work:
          allOf:
          - $ref: '#/components/schemas/WorkSummary'
          nullable: true
          description: Null while the work is a draft.
        work_typescripts:
          type: array
          items:
            $ref: '#/components/schemas/TypescriptRow'
          description: The work's typescripts by shelfmark, this one included.
        fragments:
          $ref: '#/components/schemas/FragmentPreview'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagChip'
          description: Tags on the typescript and on its fragments, by name.
        materials:
          allOf:
          - $ref: '#/components/schemas/ContextualMaterials'
          description: Those linked to the typescript's work.
      required:
      - description
      - document
      - fragments
      - id
      - materials
      - page_count
      - shelfmark
      - tags
      - title
      - work
      - work_typescripts
    TypescriptRow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        shelfmark:
          type: string
          readOnly: true
          description: E.g. "ML, sygn. 1618"; may be empty.
      required:
      - id
      - shelfmark
      - title
    VisualMaterial:
      type: object
      description: A thumbnail of "Materiały wizualne" (R-08), captioned with title
        and shelfmark.
      properties:
        url:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        shelfmark:
          type: string
          readOnly: true
          description: E.g. "ML, sygn. 1700"; may be empty.
        image:
          type: string
          readOnly: true
          description: Empty when the material has no image.
        image_alt:
          type: string
          readOnly: true
          title: Image text alternative
      required:
      - image
      - image_alt
      - shelfmark
      - title
      - url
    WorkCard:
      type: object
      description: |-
        The work card (US-RA-01 AC3), from a queryset with `with_year()` and
        `with_fragment_count()`.
      properties:
        slug:
          type: string
          readOnly: true
          description: Part of the page address.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        genre:
          type: string
          readOnly: true
          description: E.g. powieść.
        year:
          type: integer
          readOnly: true
          nullable: true
          description: The year of the first edition; null without editions.
        cover_image:
          type: string
          readOnly: true
          description: Empty when the work has no cover.
        cover_image_alt:
          type: string
          readOnly: true
          title: Cover image text alternative
        fragment_count:
          type: integer
          readOnly: true
          description: Visible fragments of the main typescript (D19); 0 without one.
      required:
      - cover_image
      - cover_image_alt
      - fragment_count
      - genre
      - slug
      - title
      - year
    WorkSummary:
      type: object
      description: |-
        A work in a context column (R-03), from a queryset with `with_year()` and
        `with_fragment_count()`.
      properties:
        slug:
          type: string
          readOnly: true
          description: Part of the page address.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        year:
          type: integer
          readOnly: true
          nullable: true
          description: The year of the first edition; null without editions.
        fragment_count:
          type: integer
          readOnly: true
          description: Visible fragments of the main typescript (D19); 0 without one.
      required:
      - fragment_count
      - slug
      - title
      - year
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
