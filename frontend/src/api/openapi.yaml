openapi: 3.0.3
info:
  title: Archivum Buczkovianum API
  version: 1.0.0
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      description: |-
        The About page (US-RA-13): introduction, project text and the team by group.

        Empty groups are left out (R-02), so the page renders every group it gets.
      tags:
      - about
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPage'
          description: ''
components:
  schemas:
    AboutPage:
      type: object
      description: US-RA-13. Texts are plain text until step 10 makes them rich text.
      properties:
        intro:
          type: string
        project:
          type: string
        team:
          type: array
          items:
            $ref: '#/components/schemas/TeamGroup'
          description: Groups that have members, in the order of TeamMember.Group.
      required:
      - intro
      - project
      - team
    GroupEnum:
      enum:
      - leadership
      - team
      - site
      type: string
      description: |-
        * `leadership` - Project leadership
        * `team` - Team members
        * `site` - Website development
    TeamGroup:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/GroupEnum'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
      required:
      - group
      - members
    TeamMember:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
      required:
      - bio
      - name
      - role
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
